<div class="social-ico-block" [class.past-hero]="pastHero" [class.bottom-corner]="bottomCorner" [class.fast-docking]="fastDocking" [class.collapsed]="collapsed" [class.avoiding-content]="avoidingContent">
    <div #linksContainer class="social-links" [attr.inert]="collapsed ? '' : null" [attr.aria-hidden]="collapsed ? 'true' : null">
        <a *ngFor="let social of socialLinks; let i = index" [href]="social.url" target="_blank" rel="noopener noreferrer" class="social-ico" [style.--social-index]="i" [attr.aria-label]="social.name">
            <img [ngSrc]="social.icon" [alt]="social.name" width="24" height="24">
        </a>
    </div>
    <button #socialTab class="social-tab" type="button" (click)="toggleSocials()"
            [attr.aria-expanded]="!collapsed" [attr.aria-label]="collapsed ? 'Show social links' : 'Hide social links'">
        <svg #waveSvg class="wave-svg" aria-hidden="true" preserveAspectRatio="none">
            <g #waveGroup class="social-tab-surface">
                <path #wavePath class="wave-body" />
                <g #waveArrow class="wave-arrow-position"><g class="social-tab-arrow"><path d="m3-6-6 6 6 6" /></g></g>
            </g>
        </svg>
    </button>
</div>
