<div class="intro" [class.rolling]="rolling" [class.title-visible]="titleVisible" [class.selected]="selected" [class.framed]="framed" [class.expanded]="expanding" aria-label="Opening Valentin Koparov’s portfolio">
    <div class="opening-title" [class.visible]="titleVisible"><span>Your perspective<br>begins here</span></div>
    <div class="frame-backlight" aria-hidden="true"></div>
    <div class="viewfinder" aria-hidden="true">
        <div class="reel">
            <div #reelFrame class="reel-frame" *ngFor="let frame of frames; let last = last">
                <img *ngIf="!last" [src]="frame" alt="">
                <div *ngIf="last" #landingFrame class="frame-live" inert></div>
            </div>
        </div>
    </div>
    <div #preview class="homepage-preview" aria-hidden="true" inert></div>
    <div class="cinema-matte matte-top" aria-hidden="true"></div>
    <div class="cinema-matte matte-bottom" aria-hidden="true"></div>
    <div class="selection-guide" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
</div>
