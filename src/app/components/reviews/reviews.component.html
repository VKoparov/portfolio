<div class="reviews-container">
    <div class="container">
        <div class="grid-1" [ngStyle]="{'transform' : objectScale}">
            <img class="smoke-background" ngSrc="assets/vectors/smoke.png" alt="Atmospheric smoke background" height="1600" width="1600">
            <div class="enter">
                <div class="content-list" [ngStyle]="{'transform' : objectScale}">
                    <div class="list desktop">
                        <div class="content-container" *ngFor="let review of reviews">
                            <img class="profile-picture" [ngSrc]="review.imgSrc" width="76" height="76" [alt]="review.name">
                            <div class="review-description-container" data-lenis-prevent>
                                <div class="review-description">{{ review.description }}</div>
                            </div>
                            <div class="profile-info">
                                <div class="profile-name">{{ review.name }}</div>
                                <div class="profile-job-title">{{ review.jobTitle }}</div>
                            </div>
                        </div>
                    </div>
                    <div class="cards mobile" tabindex="0" role="region"
                         aria-roledescription="carousel" aria-label="Reviews. Swipe left or right to change review."
                         (pointerdown)="onPointerDown($event)" (pointermove)="onPointerMove($event)"
                         (pointerup)="onPointerUp($event)" (pointercancel)="cancelSwipe()"
                         (lostpointercapture)="onLostPointerCapture($event)"
                         (keydown.arrowleft)="changeReview(-1); $event.preventDefault()"
                         (keydown.arrowright)="changeReview(1); $event.preventDefault()">
                        <ng-container *ngFor="let review of reviews; let i = index">
                            <article class="card" [style.--angle]="getCardAngle(i)"
                                     [style.z-index]="i === activeReview ? 10 : (reviews.length + activeReview - i) % reviews.length"
                                     [class.active]="i === activeReview" [class.dragging]="i === activeReview && dragging"
                                     [style.transform]="i === activeReview ? 'translateX(' + dragX + 'px) rotate(' + dragX / 25 + 'deg)' : null"
                                     [attr.aria-hidden]="i !== activeReview">
                                <div class="card-img content-container">
                                    <img
                                            class="profile-picture"
                                            [ngSrc]="review.imgSrc"
                                            width="76"
                                            height="76"
                                            [alt]="review.name"
                                    />
                                    <div class="review-description-container" data-lenis-prevent>
                                        <div class="review-description">{{ review.description }}</div>
                                    </div>
                                    <div class="profile-info">
                                        <div class="profile-name">{{ review.name }}</div>
                                        <div class="profile-job-title">{{ review.jobTitle }}</div>
                                    </div>
                                </div>
                            </article>
                        </ng-container>
                        <span class="sr-only" aria-live="polite">Review {{ activeReview + 1 }} of {{ reviews.length }}: {{ reviews[activeReview].name }}</span>
                    </div>
                </div>
            </div>
            <div class="top-fade"></div>
            <app-bottom-fade></app-bottom-fade>
        </div>
    </div>
</div>
