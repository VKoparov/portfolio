<div class="navigation-bar-container">
    <app-hamburger-menu-button appMagnetic (click)="handleNavigationOpenEvent()" [menuItemClickEvent]="menuItemClickEvent.asObservable()" class="ham-menu-btn" aria-label="Toggle navigation menu"></app-hamburger-menu-button>
    <div class="logo-container">
        <h3 *ngIf="!isLogoVisible" class="logo-name logo">VALENTIN KOPAROV</h3>
        <img *ngIf="isLogoVisible" class="logo-svg logo" ngSrc="assets/icons/logo.svg" alt="Valentin Koparov Logo" priority height="100" width="100">
    </div>
    <a class="nav-btn" href="mailto:valentinkoparov.dev@gmail.com">Get in touch</a>
</div>
<nav id="main-navigation" [class.active]="isNavigationOpen" [attr.aria-hidden]="!isNavigationOpen" [attr.inert]="isNavigationOpen ? null : ''" aria-label="Main Navigation">
    <img #menuBackground class="background-image" [class.ready]="isBackgroundReady" (load)="handleBackgroundLoad(menuBackground)" ngSrc="assets/images/winter-blizzard.webp" fetchpriority="high" priority fill alt="Winter blizzard scenery">
    <div class="top-fade"></div>
    <div class="left-fade"></div>
    <div class="navigation-button-container">
        <button *ngFor="let navigation of siteNavigation; let i = index" [style.--item-index]="i" [style.--exit-index]="siteNavigation.length - 1 - i" [ngClass]="{'active-nav-btn' : navigation === currentLocation}" class="navigation-button" (click)="scrollIntoPage(navigation)">
            {{ formatNavigation(navigation) }}
        </button>
    </div>
</nav>
